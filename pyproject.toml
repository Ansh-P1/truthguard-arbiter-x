[project]
name = "truthguard"
version = "0.1.0"
description = "TruthGuard ARBITER-X Lite: multi-agent document Q&A with deterministic conflict resolution"
requires-python = ">=3.11"
dependencies = [
  "duckdb",
  "rank_bm25",
  "numpy",
  "pydantic>=2",
  "pyyaml",
  "langgraph",
  "streamlit",
  "mcp",
  "pyvis",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
